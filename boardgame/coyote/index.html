<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>土狼在笑你 · 发牌</title>
  <style>
    :root {
      --bg: #1a1410;
      --panel: #2a2118;
      --ink: #f3e6d0;
      --muted: #b8a48a;
      --accent: #d4783a;
      --accent-2: #c44b3c;
      --line: rgba(243, 230, 208, 0.18);
      --ok: #6aa84f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse at top, #3a2a1c 0%, transparent 55%),
        linear-gradient(160deg, #1a1410, #0f0c09 70%);
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .wrap {
      width: min(520px, 100%);
      margin: 0 auto;
      padding: 24px 18px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.65rem;
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .panel {
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }

    label {
      display: block;
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    input {
      width: 100%;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #140f0c;
      color: var(--ink);
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #1a1410;
      background: linear-gradient(135deg, var(--accent), #e8a05a);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    button.danger {
      background: linear-gradient(135deg, var(--accent-2), #e07a6a);
      color: #fff;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    button:not(:disabled):active {
      transform: scale(0.98);
    }

    .status {
      margin-top: 14px;
      min-height: 1.2em;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status.error { color: #ff8d7a; }
    .status.ok { color: #9ad37a; }

    .hidden { display: none !important; }

    .room-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 14px;
    }

    .room-head strong {
      font-size: 1.2rem;
      letter-spacing: 0.08em;
    }

    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
    }

    .pill.host {
      color: #1a1410;
      background: var(--accent);
      border-color: transparent;
    }

    .players {
      list-style: none;
      margin: 0 0 16px;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .players li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: #140f0c;
      border: 1px solid var(--line);
    }

    .players .you {
      color: var(--accent);
      font-size: 0.8rem;
    }

    /* 全屏牌面 */
    #cardScreen {
      position: fixed;
      inset: 0;
      z-index: 20;
      background:
        radial-gradient(circle at 30% 20%, #4a321f, transparent 45%),
        radial-gradient(circle at 80% 80%, #3a1d16, transparent 40%),
        #120d0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    #cardScreen .hint {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #cardValue {
      font-size: clamp(4.5rem, 22vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.02em;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      word-break: break-all;
      max-width: 92vw;
    }

    #cardValue.special {
      font-size: clamp(3rem, 14vw, 6rem);
      color: #ffd29a;
    }

    #cardScreen .meta {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    #cardScreen .actions {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
    }

    @media (orientation: landscape) and (max-height: 500px) {
      #cardValue {
        font-size: clamp(3.5rem, 18vh, 7rem);
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>土狼在笑你</h1>
    <p class="sub">输入房间号进房，房主发牌后每人只显示自己的牌（可当额头牌使用）。</p>

    <section id="httpsHint" class="panel hidden" style="margin-bottom:16px;border-color:#d4783a;">
      <p class="sub" style="margin:0 0 12px;">当前是 HTTPS 博客页，浏览器会拦截不安全的 WebSocket。请改用服务器页面联机（同一套界面）：</p>
      <div class="btn-row">
        <a id="openServerBtn" href="http://120.48.19.171:3001/" style="display:inline-block;padding:12px 18px;border-radius:999px;background:linear-gradient(135deg,#d4783a,#e8a05a);color:#1a1410;text-decoration:none;font-weight:600;">打开联机发牌页</a>
      </div>
    </section>

    <section id="lobby" class="panel">
      <label for="nickname">昵称</label>
      <input id="nickname" maxlength="12" placeholder="例如：小狼" autocomplete="nickname">

      <label for="roomId">房间号</label>
      <input id="roomId" maxlength="12" placeholder="例如：8888" autocomplete="off">

      <div class="btn-row">
        <button id="joinBtn" type="button">进入房间</button>
      </div>
      <div id="lobbyStatus" class="status"></div>
    </section>

    <section id="room" class="panel hidden">
      <div class="room-head">
        <div>
          <div class="pill" id="roomLabel">房间</div>
          <strong id="roomCode"></strong>
        </div>
        <span class="pill" id="hostBadge"></span>
      </div>

      <ul class="players" id="playerList"></ul>

      <div class="btn-row">
        <button id="dealBtn" type="button" class="hidden">发牌</button>
        <button id="showCardBtn" type="button" class="secondary hidden">查看我的牌</button>
        <button id="leaveBtn" type="button" class="secondary">离开房间</button>
      </div>
      <div id="roomStatus" class="status"></div>
    </section>
  </div>

  <div id="cardScreen" class="hidden">
    <div class="hint">把手机举给别人看 · 自己别偷看</div>
    <div id="cardValue">?</div>
    <div class="meta" id="cardMeta"></div>
    <div class="actions">
      <button id="hideCardBtn" type="button" class="secondary">返回房间</button>
      <button id="redealBtn" type="button" class="hidden">再来一局</button>
    </div>
  </div>

  <script>
    // 同机部署时用当前 host；博客 HTTPS 页无法连 ws://，会引导到服务器 HTTP 页
    const SERVER_HTTP = 'http://120.48.19.171:3001';
    const WS_URL = (function () {
      if (location.protocol === 'http:' && /120\.48\.19\.171/.test(location.host)) {
        return `ws://${location.host}`;
      }
      return 'ws://120.48.19.171:3001';
    })();

    const els = {
      lobby: document.getElementById('lobby'),
      room: document.getElementById('room'),
      nickname: document.getElementById('nickname'),
      roomId: document.getElementById('roomId'),
      joinBtn: document.getElementById('joinBtn'),
      lobbyStatus: document.getElementById('lobbyStatus'),
      roomCode: document.getElementById('roomCode'),
      hostBadge: document.getElementById('hostBadge'),
      playerList: document.getElementById('playerList'),
      dealBtn: document.getElementById('dealBtn'),
      showCardBtn: document.getElementById('showCardBtn'),
      leaveBtn: document.getElementById('leaveBtn'),
      roomStatus: document.getElementById('roomStatus'),
      cardScreen: document.getElementById('cardScreen'),
      cardValue: document.getElementById('cardValue'),
      cardMeta: document.getElementById('cardMeta'),
      hideCardBtn: document.getElementById('hideCardBtn'),
      redealBtn: document.getElementById('redealBtn'),
    };

    const state = {
      ws: null,
      playerId: null,
      isHost: false,
      myCard: null,
      roomId: '',
      nickname: '',
    };

    function setStatus(el, text, type) {
      el.textContent = text || '';
      el.classList.remove('error', 'ok');
      if (type) el.classList.add(type);
    }

    function isSpecialCard(card) {
      return ['MAX0', 'MAX-', '???', 'x2'].includes(card);
    }

    function renderCard(card) {
      els.cardValue.textContent = card;
      els.cardValue.classList.toggle('special', isSpecialCard(card) || card === '0');
      els.cardMeta.textContent = `房间 ${state.roomId} · ${state.nickname}`;
    }

    function showCardScreen(show) {
      els.cardScreen.classList.toggle('hidden', !show);
    }

    function renderPlayers(players) {
      els.playerList.innerHTML = '';
      players.forEach((p) => {
        const li = document.createElement('li');
        const name = document.createElement('span');
        name.textContent = p.nickname + (p.isHost ? '（房主）' : '');
        li.appendChild(name);
        if (p.id === state.playerId) {
          const you = document.createElement('span');
          you.className = 'you';
          you.textContent = '我';
          li.appendChild(you);
        }
        els.playerList.appendChild(li);
      });
    }

    function applyState(msg) {
      state.playerId = msg.playerId || state.playerId;
      state.isHost = !!msg.isHost;
      state.myCard = msg.myCard ?? state.myCard;
      state.roomId = msg.roomId || state.roomId;

      els.lobby.classList.add('hidden');
      els.room.classList.remove('hidden');
      els.roomCode.textContent = state.roomId;
      els.hostBadge.textContent = state.isHost ? '你是房主' : '等待房主发牌';
      els.hostBadge.classList.toggle('host', state.isHost);

      renderPlayers(msg.players || []);

      els.dealBtn.classList.toggle('hidden', !state.isHost);
      els.redealBtn.classList.toggle('hidden', !state.isHost);
      els.dealBtn.textContent = state.myCard ? '再来一局' : '发牌';
      els.dealBtn.disabled = (msg.players || []).length < 1;

      const hasCard = !!state.myCard;
      els.showCardBtn.classList.toggle('hidden', !hasCard);

      if (hasCard) {
        renderCard(state.myCard);
        setStatus(els.roomStatus, '已发牌，可查看你的牌', 'ok');
      } else {
        setStatus(els.roomStatus, `当前 ${ (msg.players || []).length } 人在房间`, 'ok');
      }
    }

    function send(type, payload) {
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
      state.ws.send(JSON.stringify({ type, ...payload }));
    }

    function connectAndJoin() {
      const nickname = els.nickname.value.trim();
      const roomId = els.roomId.value.trim().toUpperCase();

      if (!nickname) {
        setStatus(els.lobbyStatus, '请填写昵称', 'error');
        return;
      }
      if (!roomId) {
        setStatus(els.lobbyStatus, '请填写房间号', 'error');
        return;
      }

      state.nickname = nickname;
      state.roomId = roomId;
      state.myCard = null;
      els.joinBtn.disabled = true;
      setStatus(els.lobbyStatus, '正在连接服务器…');

      if (state.ws) {
        try { state.ws.close(); } catch (_) {}
      }

      const ws = new WebSocket(WS_URL);
      state.ws = ws;

      ws.onopen = () => {
        setStatus(els.lobbyStatus, '已连接，正在进房…', 'ok');
        send('join', { roomId, nickname });
      };

      ws.onmessage = (ev) => {
        let msg;
        try {
          msg = JSON.parse(ev.data);
        } catch (_) {
          return;
        }

        if (msg.type === 'error') {
          setStatus(els.lobbyStatus, msg.message || '出错了', 'error');
          setStatus(els.roomStatus, msg.message || '出错了', 'error');
          els.joinBtn.disabled = false;
          return;
        }

        if (msg.type === 'state') {
          applyState(msg);
          els.joinBtn.disabled = false;
          if (msg.justDealt && state.myCard) {
            showCardScreen(true);
          }
        }
      };

      ws.onerror = () => {
        setStatus(els.lobbyStatus, '连接失败，请确认后端已启动且安全组开放 3001', 'error');
        els.joinBtn.disabled = false;
      };

      ws.onclose = () => {
        if (!els.room.classList.contains('hidden')) {
          setStatus(els.roomStatus, '连接已断开，请重新进房', 'error');
        }
        els.joinBtn.disabled = false;
      };
    }

    function leaveRoom() {
      send('leave', {});
      if (state.ws) {
        try { state.ws.close(); } catch (_) {}
      }
      state.ws = null;
      state.playerId = null;
      state.isHost = false;
      state.myCard = null;
      showCardScreen(false);
      els.room.classList.add('hidden');
      els.lobby.classList.remove('hidden');
      setStatus(els.lobbyStatus, '已离开房间');
    }

    els.joinBtn.addEventListener('click', connectAndJoin);
    els.dealBtn.addEventListener('click', () => send('start', {}));
    els.redealBtn.addEventListener('click', () => send('start', {}));
    els.showCardBtn.addEventListener('click', () => {
      if (state.myCard) {
        renderCard(state.myCard);
        showCardScreen(true);
      }
    });
    els.hideCardBtn.addEventListener('click', () => showCardScreen(false));
    els.leaveBtn.addEventListener('click', leaveRoom);

    els.roomId.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connectAndJoin();
    });
    els.nickname.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connectAndJoin();
    });

    // HTTPS 博客页：提示改用服务器 HTTP 页（避免混合内容拦截 ws://）
    if (location.protocol === 'https:') {
      document.getElementById('httpsHint').classList.remove('hidden');
    }

    // 记住上次昵称
    try {
      const saved = localStorage.getItem('coyote_nickname');
      if (saved) els.nickname.value = saved;
      els.nickname.addEventListener('change', () => {
        localStorage.setItem('coyote_nickname', els.nickname.value.trim());
      });
    } catch (_) {}
  </script>
</body>
</html>
