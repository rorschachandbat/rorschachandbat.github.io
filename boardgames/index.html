  const itemPerPage = 10;
  const metaMaxLine = 4;
  let page = 1;
  let pageMax = 1;

  function renderItem(row) {
    const item = document.createElement('div');
    item.className = 'hexo-gstone-item';

    const picture = document.createElement('div');
    picture.className = 'hexo-gstone-picture';
    const img = document.createElement('img');
    img.src = row.image || '';
    img.loading = 'lazy';
    img.referrerPolicy = 'no-referrer';
    picture.appendChild(img);

    const info = document.createElement('div');
    info.className = 'hexo-gstone-info';

    const title = document.createElement('div');
    title.className = 'hexo-gstone-title';
    const a = document.createElement('a');
    a.href = row.alt;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = row.title || '';
    title.appendChild(a);

    const meta = document.createElement('div');
    meta.className = 'hexo-gstone-meta';
    meta.textContent = row.meta || '';
    meta.style.webkitLineClamp = String(metaMaxLine);

    const rating = document.createElement('div');
    rating.className = 'hexo-gstone-rating';
    const rateNum = Number(row.rate);
    if (row.date || rateNum) {
      if (row.date) rating.appendChild(document.createTextNode(row.date + (rateNum ? ' / ' : '')));
      if (rateNum) {
        const stars = document.createElement('span');
        stars.className = 'hexo-gstone-stars';
        stars.title = String(rateNum);
        const empty = document.createElement('span');
        empty.textContent = '★★★★★';
        const fill = document.createElement('span');
        fill.className = 'hexo-gstone-stars-fill';
        fill.style.width = Math.max(0, Math.min(100, (rateNum / 5) * 100)) + '%';
        fill.textContent = '★★★★★';
        stars.appendChild(empty);
        stars.appendChild(fill);
        rating.appendChild(stars);
      }
    } else {
      rating.textContent = row.rating || '';
    }

    const comment = document.createElement('div');
    comment.className = 'hexo-gstone-comment';
    comment.textContent = row.comment || '';

    info.appendChild(title);
    info.appendChild(meta);
    info.appendChild(rating);
    info.appendChild(comment);

    if (row.images && row.images.length) {
      const photos = document.createElement('div');
      photos.className = 'hexo-gstone-photos';
      row.images.forEach((src) => {
        const p = document.createElement('a');
        p.href = src;
        p.target = '_blank';
        p.rel = 'noopener';
        const im = document.createElement('img');
        im.src = src;
        im.loading = 'lazy';
        im.referrerPolicy = 'no-referrer';
        p.appendChild(im);
        photos.appendChild(p);
      });
      info.appendChild(photos);
    }

    item.appendChild(picture);
    item.appendChild(info);
    return item;
  }

  function render(p) {
    pageMax = Math.max(1, Math.floor((data.collect.length - 1) / itemPerPage) + 1);
    page = Math.min(Math.max(1, p), pageMax);
    document.querySelector('.hexo-gstone-pagenum').textContent = page + ' / ' + pageMax;
    const box = document.querySelector('.hexo-gstone-items');
    box.innerHTML = '';
    const start = (page - 1) * itemPerPage;
    const end = Math.min(start + itemPerPage, data.collect.length);
    for (let i = start; i < end; i++) box.appendChild(renderItem(data.collect[i]));
  }

  document.querySelector('.hexo-gstone-firstpage').onclick = () => render(1);
  document.querySelector('.hexo-gstone-previouspage').onclick = () => render(page - 1);
  document.querySelector('.hexo-gstone-nextpage').onclick = () => render(page + 1);
  document.querySelector('.hexo-gstone-lastpage').onclick = () => render(pageMax);
  render(1);
})();
</script>
